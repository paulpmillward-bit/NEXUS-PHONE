name: Build NEXUS Phone

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Android project
        run: |
          set -e
          cat > settings.gradle <<'NEXUS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NexusPhone"
          include ':app'
          NEXUS_EOF
          cat > build.gradle <<'NEXUS_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          NEXUS_EOF
          cat > gradle.properties <<'NEXUS_EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          NEXUS_EOF
          mkdir -p app
          cat > app/build.gradle <<'NEXUS_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          def runNo = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')

          android {
              namespace 'com.nexus.phone'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.nexus.phone'
                  minSdk 26
                  targetSdk 35
                  versionCode runNo
                  versionName "0.1.${runNo}"
              }

              signingConfigs {
                  fixed {
                      storeFile file('nexus.keystore')
                      storePassword 'nexus123'
                      keyAlias 'nexus'
                      keyPassword 'nexus123'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.fixed
                      minifyEnabled false
                  }
                  debug {
                      signingConfig signingConfigs.fixed
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.recyclerview:recyclerview:1.3.2'
              implementation 'androidx.viewpager2:viewpager2:1.1.0'
          }
          NEXUS_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'NEXUS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.EXPAND_STATUS_BAR" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="NEXUS"
                  android:theme="@style/Theme.Nexus">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:stateNotNeeded="true"
                      android:resumeWhilePausing="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode|screenLayout|smallestScreenSize|density|fontScale">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false"
                      android:label="NEXUS settings"
                      android:theme="@style/Theme.Nexus.Settings" />
              </application>
          </manifest>
          NEXUS_EOF
          mkdir -p app/src/main/java/com/nexus/phone
          cat > app/src/main/java/com/nexus/phone/Prefs.kt <<'NEXUS_EOF'
          package com.nexus.phone

          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.view.ViewGroup

          const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

          fun navy(a: Int): Int = Color.argb(a, 8, 14, 30)

          fun withAlpha(c: Int, a: Int): Int = (c and 0x00FFFFFF) or (a shl 24)

          fun Context.rounded(fill: Int, radiusDp: Int, stroke: Int = 0, strokeDp: Int = 0): GradientDrawable {
              val g = GradientDrawable()
              g.setColor(fill)
              g.cornerRadius = dp(radiusDp).toFloat()
              if (strokeDp > 0) g.setStroke(dp(strokeDp), stroke)
              return g
          }

          class Prefs(ctx: Context) {
              val sp: SharedPreferences = ctx.getSharedPreferences("nexus", Context.MODE_PRIVATE)

              var accent: Int
                  get() = sp.getInt("accent", Color.parseColor("#22D3EE"))
                  set(v) { sp.edit().putInt("accent", v).apply() }

              var iconSize: Int
                  get() = sp.getInt("iconSize", 56)
                  set(v) { sp.edit().putInt("iconSize", v).apply() }

              var columns: Int
                  get() = sp.getInt("columns", 4)
                  set(v) { sp.edit().putInt("columns", v).apply() }

              var scrim: Int
                  get() = sp.getInt("scrim", 55)
                  set(v) { sp.edit().putInt("scrim", v).apply() }

              var showJump: Boolean
                  get() = sp.getBoolean("showJump", true)
                  set(v) { sp.edit().putBoolean("showJump", v).apply() }

              var showLabels: Boolean
                  get() = sp.getBoolean("showLabels", true)
                  set(v) { sp.edit().putBoolean("showLabels", v).apply() }

              fun list(k: String): MutableList<String> =
                  (sp.getString(k, "") ?: "").split("|").filter { it.isNotEmpty() }.toMutableList()

              fun setList(k: String, l: List<String>) {
                  sp.edit().putString(k, l.joinToString("|")).apply()
              }
          }
          NEXUS_EOF
          mkdir -p app/src/main/java/com/nexus/phone
          cat > app/src/main/java/com/nexus/phone/MainActivity.kt <<'NEXUS_EOF'
          package com.nexus.phone

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ComponentName
          import android.content.ClipData
          import android.content.Context
          import android.content.Intent
          import android.content.pm.LauncherApps
          import android.content.pm.ShortcutInfo
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.PorterDuff
          import android.graphics.PorterDuffXfermode
          import android.graphics.Typeface
          import android.graphics.drawable.AdaptiveIconDrawable
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.Process
          import android.os.UserHandle
          import android.provider.Settings
          import android.text.Editable
          import android.text.InputType
          import android.text.TextUtils
          import android.text.TextWatcher
          import android.util.TypedValue
          import android.view.DragEvent
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextClock
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.view.ViewCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.recyclerview.widget.RecyclerView
          import androidx.viewpager2.widget.ViewPager2
          import java.util.concurrent.Executors
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class AppItem(val key: String, val label: String, val component: ComponentName, val icon: Bitmap)

          class DragState(val key: String, val list: String) {
              var moved = false
              var dropped = false
          }

          class MainActivity : Activity() {
              private lateinit var prefs: Prefs
              private lateinit var la: LauncherApps
              private lateinit var root: FrameLayout
              private lateinit var home: LinearLayout
              private lateinit var pager: ViewPager2
              private lateinit var dots: LinearLayout
              private lateinit var dockBox: LinearLayout
              private lateinit var pill: TextView
              private lateinit var drawer: FrameLayout
              private lateinit var drawerBox: LinearLayout
              private lateinit var grid: GridView
              private lateinit var search: EditText

              private var apps: List<AppItem> = emptyList()
              private val byKey = HashMap<String, AppItem>()
              private var shown: List<AppItem> = emptyList()
              private var drawerOpen = false

              private val bg = Executors.newSingleThreadExecutor()
              private val ui = Handler(Looper.getMainLooper())

              private var dX = 0f
              private var dY = 0f
              private var dT = 0L
              private var atTop = true
              private var drag: DragState? = null
              private var edgeDir = 0
              private val maxPages = 5

              // While a dragged icon hovers at the screen edge, flip to the neighbouring page.
              private val edgeRun: Runnable = object : Runnable {
                  override fun run() {
                      val t = (pager.currentItem + edgeDir).coerceIn(0, pageCount() - 1)
                      if (t != pager.currentItem) pager.setCurrentItem(t, true)
                      ui.postDelayed(this, 700)
                  }
              }

              private val appAdapter = object : BaseAdapter() {
                  override fun getCount(): Int = shown.size
                  override fun getItem(position: Int): Any = shown[position]
                  override fun getItemId(position: Int): Long = position.toLong()
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View =
                      appView(shown[position], prefs.iconSize, true)
              }

              private val cb = object : LauncherApps.Callback() {
                  override fun onPackageRemoved(packageName: String?, user: UserHandle?) { loadApps() }
                  override fun onPackageAdded(packageName: String?, user: UserHandle?) { loadApps() }
                  override fun onPackageChanged(packageName: String?, user: UserHandle?) { loadApps() }
                  override fun onPackagesAvailable(packageNames: Array<out String>?, user: UserHandle?, replacing: Boolean) { loadApps() }
                  override fun onPackagesUnavailable(packageNames: Array<out String>?, user: UserHandle?, replacing: Boolean) { loadApps() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  prefs = Prefs(this)
                  la = getSystemService(LauncherApps::class.java)
                  buildUi()
                  loadApps()
              }

              override fun onStart() {
                  super.onStart()
                  try { la.registerCallback(cb) } catch (e: Exception) {}
              }

              override fun onStop() {
                  super.onStop()
                  try { la.unregisterCallback(cb) } catch (e: Exception) {}
              }

              override fun onResume() {
                  super.onResume()
                  if (apps.isNotEmpty()) {
                      renderHome()
                      if (drawerOpen) refreshGrid()
                  }
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  if (intent?.action == Intent.ACTION_MAIN) {
                      search.setText("")
                      closeDrawer(false)
                  }
              }

              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  if (drawerOpen) closeDrawer()
              }

              // ---------- UI construction ----------

              private fun buildUi() {
                  root = FrameLayout(this)
                  buildHome()
                  root.addView(home, FrameLayout.LayoutParams(MATCH, MATCH))
                  root.addView(edgeZone(-1), FrameLayout.LayoutParams(dp(32), MATCH, Gravity.START))
                  root.addView(edgeZone(1), FrameLayout.LayoutParams(dp(32), MATCH, Gravity.END))
                  root.isLongClickable = true
                  root.setOnLongClickListener {
                      startActivity(Intent(this, SettingsActivity::class.java))
                      true
                  }
                  buildDrawer()
                  root.addView(drawer, FrameLayout.LayoutParams(MATCH, MATCH))
                  setContentView(root)
                  ViewCompat.setOnApplyWindowInsetsListener(root) { _, ins ->
                      val b = ins.getInsets(WindowInsetsCompat.Type.systemBars())
                      val ime = ins.getInsets(WindowInsetsCompat.Type.ime())
                      home.setPadding(dp(20), b.top + dp(20), dp(20), b.bottom + dp(14))
                      drawerBox.setPadding(dp(12), b.top + dp(8), dp(12), max(b.bottom, ime.bottom) + dp(12))
                      ins
                  }
              }

              private fun buildDrawer() {
                  drawer = FrameLayout(this)
                  drawer.setBackgroundColor(navy(0xEE))
                  drawer.isClickable = true
                  drawer.visibility = View.GONE
                  drawerBox = LinearLayout(this)
                  drawerBox.orientation = LinearLayout.VERTICAL

                  grid = GridView(this)
                  grid.numColumns = 4
                  grid.verticalSpacing = dp(6)
                  grid.selector = ColorDrawable(Color.TRANSPARENT)
                  grid.overScrollMode = View.OVER_SCROLL_NEVER
                  grid.isVerticalScrollBarEnabled = false
                  grid.adapter = appAdapter
                  drawerBox.addView(grid, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  search = EditText(this)
                  search.hint = "Search apps"
                  search.setHintTextColor(Color.parseColor("#99FFFFFF"))
                  search.setTextColor(Color.WHITE)
                  search.setSingleLine(true)
                  search.inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                  search.imeOptions = EditorInfo.IME_ACTION_GO
                  search.setPadding(dp(20), 0, dp(20), 0)
                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) { refreshGrid() }
                      override fun afterTextChanged(s: Editable?) {}
                  })
                  search.setOnEditorActionListener { _, _, _ ->
                      if (shown.isNotEmpty()) launch(shown[0])
                      true
                  }
                  val lp = LinearLayout.LayoutParams(MATCH, dp(52))
                  lp.topMargin = dp(8)
                  drawerBox.addView(search, lp)

                  drawer.addView(drawerBox, FrameLayout.LayoutParams(MATCH, MATCH))
              }

              private fun tv(text: String, sp: Float, color: Int, bold: Boolean = false): TextView {
                  val t = TextView(this)
                  t.text = text
                  t.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp)
                  t.setTextColor(color)
                  if (bold) t.typeface = Typeface.DEFAULT_BOLD
                  t.setShadowLayer(6f, 0f, 1f, Color.argb(120, 0, 0, 0))
                  return t
              }

              private fun scrimDrawable(): GradientDrawable {
                  val a = prefs.scrim * 255 / 100
                  return GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      intArrayOf(navy(a * 6 / 10), navy(a * 4 / 10), navy(a))
                  )
              }

              private fun pageKey(i: Int): String = if (i == 0) "pinned" else "pinned$i"

              private fun pageCap(i: Int): Int = if (i == 0) prefs.columns * 3 else prefs.columns * 5

              private fun capOf(list: String): Int = when (list) {
                  "dock" -> 5
                  "pinned" -> prefs.columns * 3
                  else -> prefs.columns * 5
              }

              // Always one spare empty page after the last used one (up to maxPages).
              private fun pageCount(): Int {
                  var last = 0
                  for (i in 0 until maxPages) if (prefs.list(pageKey(i)).isNotEmpty()) last = i
                  return min(maxPages, last + 2)
              }

              private inner class PagesAdapter : RecyclerView.Adapter<RecyclerView.ViewHolder>() {
                  override fun getItemCount(): Int = pageCount()
                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): RecyclerView.ViewHolder {
                      val v = LinearLayout(this@MainActivity)
                      v.orientation = LinearLayout.VERTICAL
                      v.layoutParams = ViewGroup.LayoutParams(MATCH, MATCH)
                      return object : RecyclerView.ViewHolder(v) {}
                  }
                  override fun onBindViewHolder(holder: RecyclerView.ViewHolder, position: Int) {
                      bindPage(holder.itemView as LinearLayout, position)
                  }
              }

              private fun buildHome() {
                  home = LinearLayout(this)
                  home.orientation = LinearLayout.VERTICAL

                  pager = ViewPager2(this)
                  pager.adapter = PagesAdapter()
                  pager.registerOnPageChangeCallback(object : ViewPager2.OnPageChangeCallback() {
                      override fun onPageSelected(position: Int) { updateDots() }
                  })
                  pager.getChildAt(0)?.overScrollMode = View.OVER_SCROLL_NEVER
                  home.addView(pager, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  dots = LinearLayout(this)
                  dots.gravity = Gravity.CENTER
                  home.addView(dots, LinearLayout.LayoutParams(MATCH, dp(24)))

                  dockBox = LinearLayout(this)
                  dockBox.orientation = LinearLayout.HORIZONTAL
                  dockBox.gravity = Gravity.CENTER
                  dockBox.minimumHeight = dp(84)
                  dockBox.setPadding(dp(8), dp(8), dp(8), dp(8))
                  dockBox.setOnDragListener(containerDrag("dock"))
                  home.addView(dockBox, LinearLayout.LayoutParams(MATCH, WRAP))

                  pill = tv("Search apps", 15f, Color.parseColor("#B3FFFFFF"))
                  pill.gravity = Gravity.CENTER_VERTICAL
                  pill.setPadding(dp(20), 0, dp(20), 0)
                  pill.setOnClickListener { openDrawer() }
                  val plp = LinearLayout.LayoutParams(MATCH, dp(52))
                  plp.topMargin = dp(12)
                  home.addView(pill, plp)
              }

              private fun edgeZone(dir: Int): View {
                  val v = View(this)
                  v.setOnDragListener { _, e ->
                      when (e.action) {
                          DragEvent.ACTION_DRAG_STARTED -> drag != null
                          DragEvent.ACTION_DRAG_ENTERED -> {
                              edgeDir = dir
                              ui.removeCallbacks(edgeRun)
                              ui.postDelayed(edgeRun, 450)
                              true
                          }
                          DragEvent.ACTION_DRAG_EXITED, DragEvent.ACTION_DROP, DragEvent.ACTION_DRAG_ENDED -> {
                              ui.removeCallbacks(edgeRun)
                              true
                          }
                          else -> true
                      }
                  }
                  return v
              }

              private fun updateDots() {
                  dots.removeAllViews()
                  val n = pageCount()
                  if (n <= 1) return
                  for (i in 0 until n) {
                      val d = View(this)
                      d.background = rounded(if (i == pager.currentItem) prefs.accent else Color.parseColor("#55FFFFFF"), 4)
                      val lp = LinearLayout.LayoutParams(dp(8), dp(8))
                      lp.setMargins(dp(4), 0, dp(4), 0)
                      dots.addView(d, lp)
                  }
              }

              private fun renderDock() {
                  dockBox.removeAllViews()
                  dockBox.background = rounded(navy(0x99), 28, withAlpha(prefs.accent, 0x44), 1)
                  val dock = prefs.list("dock").mapNotNull { byKey[it] }.take(5)
                  dock.forEach { a -> dockBox.addView(appView(a, prefs.iconSize, false, "dock"), LinearLayout.LayoutParams(0, WRAP, 1f)) }
              }

              private fun renderHome() {
                  firstRunDefaults()
                  root.background = scrimDrawable()
                  pill.background = rounded(navy(0xB3), 26, withAlpha(prefs.accent, 0x88), 1)
                  pager.adapter?.notifyDataSetChanged()
                  renderDock()
                  updateDots()
              }

              private fun bindPage(page: LinearLayout, i: Int) {
                  page.removeAllViews()
                  val key = pageKey(i)
                  page.setOnDragListener(containerDrag(key))
                  page.isLongClickable = true
                  page.setOnLongClickListener {
                      startActivity(Intent(this, SettingsActivity::class.java))
                      true
                  }
                  val accent = prefs.accent

                  if (i == 0) {
                      val clock = TextClock(this)
                      clock.setFormat12Hour("h:mm")
                      clock.setFormat24Hour("HH:mm")
                      clock.setTextSize(TypedValue.COMPLEX_UNIT_SP, 68f)
                      clock.setTextColor(Color.WHITE)
                      clock.typeface = Typeface.create("sans-serif-thin", Typeface.NORMAL)
                      clock.includeFontPadding = false
                      clock.setShadowLayer(8f, 0f, 2f, Color.argb(110, 0, 0, 0))
                      page.addView(clock, LinearLayout.LayoutParams(WRAP, WRAP))

                      val date = TextClock(this)
                      date.setFormat12Hour("EEEE, d MMMM")
                      date.setFormat24Hour("EEEE, d MMMM")
                      date.setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
                      date.setTextColor(accent)
                      date.setShadowLayer(6f, 0f, 1f, Color.argb(120, 0, 0, 0))
                      page.addView(date, LinearLayout.LayoutParams(WRAP, WRAP))

                      val recents = prefs.list("recents").mapNotNull { byKey[it] }.take(6)
                      if (prefs.showJump && recents.isNotEmpty()) {
                          val label = tv("JUMP BACK IN", 12f, withAlpha(accent, 0xE6), true)
                          label.letterSpacing = 0.15f
                          val llp = LinearLayout.LayoutParams(WRAP, WRAP)
                          llp.topMargin = dp(28)
                          llp.bottomMargin = dp(8)
                          page.addView(label, llp)
                          val hs = HorizontalScrollView(this)
                          hs.isHorizontalScrollBarEnabled = false
                          hs.overScrollMode = View.OVER_SCROLL_NEVER
                          val row = LinearLayout(this)
                          row.orientation = LinearLayout.HORIZONTAL
                          recents.forEachIndexed { n, a ->
                              val p = LinearLayout.LayoutParams(WRAP, WRAP)
                              p.marginEnd = dp(10)
                              row.addView(card(a, n == 0), p)
                          }
                          hs.addView(row)
                          page.addView(hs, LinearLayout.LayoutParams(MATCH, WRAP))
                      }
                  }

                  val cols = prefs.columns
                  val items = prefs.list(key).mapNotNull { byKey[it] }.take(pageCap(i))
                  val title = if (i == 0) "FAVOURITES" else "PAGE " + (i + 1)
                  val label = tv(title, 12f, withAlpha(accent, 0xE6), true)
                  label.letterSpacing = 0.15f
                  val llp = LinearLayout.LayoutParams(WRAP, WRAP)
                  llp.topMargin = dp(if (i == 0) 24 else 12)
                  llp.bottomMargin = dp(4)
                  page.addView(label, llp)

                  if (items.isEmpty()) {
                      val hint = tv("Nothing here yet.\nLong-press an app and drag it onto this page.", 14f, Color.parseColor("#80FFFFFF"))
                      hint.gravity = Gravity.CENTER
                      val hp = LinearLayout.LayoutParams(MATCH, WRAP)
                      hp.topMargin = dp(48)
                      page.addView(hint, hp)
                  }
                  items.chunked(cols).forEach { chunk ->
                      val r = LinearLayout(this)
                      r.orientation = LinearLayout.HORIZONTAL
                      chunk.forEach { a -> r.addView(appView(a, prefs.iconSize, prefs.showLabels, key), LinearLayout.LayoutParams(0, WRAP, 1f)) }
                      repeat(cols - chunk.size) { r.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f)) }
                      page.addView(r, LinearLayout.LayoutParams(MATCH, WRAP))
                  }
              }

              private fun card(a: AppItem, first: Boolean): View {
                  val accent = prefs.accent
                  val c = LinearLayout(this)
                  c.orientation = LinearLayout.HORIZONTAL
                  c.gravity = Gravity.CENTER_VERTICAL
                  c.setPadding(dp(12), dp(10), dp(16), dp(10))
                  c.background = rounded(
                      navy(if (first) 0xCC else 0x99), 18,
                      if (first) accent else withAlpha(accent, 0x44),
                      if (first) 2 else 1
                  )
                  val iv = ImageView(this)
                  iv.setImageBitmap(a.icon)
                  c.addView(iv, LinearLayout.LayoutParams(dp(36), dp(36)))
                  val t = tv(a.label, 14f, Color.WHITE)
                  t.maxLines = 1
                  t.ellipsize = TextUtils.TruncateAt.END
                  t.maxWidth = dp(120)
                  val tp = LinearLayout.LayoutParams(WRAP, WRAP)
                  tp.marginStart = dp(10)
                  c.addView(t, tp)
                  c.setOnClickListener { launch(a) }
                  c.setOnLongClickListener { showMenu(a); true }
                  return c
              }

              private fun appView(a: AppItem, size: Int, label: Boolean, list: String? = null): View {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.gravity = Gravity.CENTER_HORIZONTAL
                  box.setPadding(dp(2), dp(8), dp(2), dp(8))
                  val iv = ImageView(this)
                  iv.setImageBitmap(a.icon)
                  box.addView(iv, LinearLayout.LayoutParams(dp(size), dp(size)))
                  if (label) {
                      val t = tv(a.label, 12f, Color.WHITE)
                      t.maxLines = 1
                      t.ellipsize = TextUtils.TruncateAt.END
                      t.gravity = Gravity.CENTER
                      val tp = LinearLayout.LayoutParams(MATCH, WRAP)
                      tp.topMargin = dp(4)
                      box.addView(t, tp)
                  }
                  box.setOnClickListener { launch(a) }
                  if (list != null) {
                      box.setOnLongClickListener { startDrag(box, a, list); true }
                      box.setOnDragListener(itemDrag(list, a.key))
                  } else {
                      box.setOnLongClickListener { showMenu(a); true }
                  }
                  return box
              }

              // ---------- Apps ----------

              // Every icon is rendered as a circle: adaptive icons get a circular mask,
              // old-style square icons are placed on a round backdrop.
              private fun toBitmap(d: Drawable): Bitmap {
                  val s = dp(80)
                  val out = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                  val c = Canvas(out)
                  if (d is AdaptiveIconDrawable) {
                      val ext = (s * 108f / 72f).toInt()
                      val off = (ext - s) / 2
                      val bgLayer = d.background
                      if (bgLayer != null) {
                          bgLayer.setBounds(-off, -off, s + off, s + off)
                          bgLayer.draw(c)
                      }
                      val fgLayer = d.foreground
                      if (fgLayer != null) {
                          fgLayer.setBounds(-off, -off, s + off, s + off)
                          fgLayer.draw(c)
                      }
                      val mask = Bitmap.createBitmap(s, s, Bitmap.Config.ARGB_8888)
                      val circle = Paint(Paint.ANTI_ALIAS_FLAG)
                      circle.color = Color.WHITE
                      Canvas(mask).drawCircle(s / 2f, s / 2f, s / 2f, circle)
                      val mp = Paint(Paint.ANTI_ALIAS_FLAG)
                      mp.xfermode = PorterDuffXfermode(PorterDuff.Mode.DST_IN)
                      c.drawBitmap(mask, 0f, 0f, mp)
                  } else {
                      val fill = if (isLight(d)) Color.parseColor("#1B2A44") else Color.parseColor("#F2F4F8")
                      val p = Paint(Paint.ANTI_ALIAS_FLAG)
                      p.color = fill
                      c.drawCircle(s / 2f, s / 2f, s / 2f, p)
                      val pad = (s * 0.19f).toInt()
                      d.setBounds(pad, pad, s - pad, s - pad)
                      d.draw(c)
                  }
                  return out
              }

              private fun isLight(d: Drawable): Boolean {
                  val t = 32
                  val b = Bitmap.createBitmap(t, t, Bitmap.Config.ARGB_8888)
                  d.setBounds(0, 0, t, t)
                  d.draw(Canvas(b))
                  var sum = 0.0
                  var n = 0
                  for (y in 0 until t) {
                      for (x in 0 until t) {
                          val px = b.getPixel(x, y)
                          if (Color.alpha(px) > 128) {
                              sum += (0.299 * Color.red(px) + 0.587 * Color.green(px) + 0.114 * Color.blue(px)) / 255.0
                              n++
                          }
                      }
                  }
                  return n > 0 && sum / n > 0.75
              }

              private fun loadApps() {
                  bg.execute {
                      try {
                          val list = la.getActivityList(null, Process.myUserHandle())
                              .filter { it.componentName.packageName != packageName }
                              .map { info ->
                                  AppItem(
                                      info.componentName.flattenToString(),
                                      info.label.toString(),
                                      info.componentName,
                                      toBitmap(info.getBadgedIcon(0))
                                  )
                              }
                              .sortedBy { it.label.lowercase() }
                          ui.post {
                              apps = list
                              byKey.clear()
                              list.forEach { byKey[it.key] = it }
                              renderHome()
                              refreshGrid()
                          }
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun firstRunDefaults() {
                  if (prefs.sp.getBoolean("init", false) || apps.isEmpty()) return
                  fun find(vararg pk: String): AppItem? =
                      pk.firstNotNullOfOrNull { p -> apps.firstOrNull { it.component.packageName == p } }
                  val dock = listOfNotNull(
                      find("com.google.android.dialer", "com.android.dialer"),
                      find("com.google.android.apps.messaging"),
                      find("com.android.chrome"),
                      find("com.google.android.GoogleCamera", "com.android.camera2")
                  )
                  val pins = listOfNotNull(
                      find("com.google.android.apps.photos"),
                      find("com.google.android.apps.maps"),
                      find("com.google.android.youtube"),
                      find("com.google.android.gm"),
                      find("com.android.vending"),
                      find("com.android.settings"),
                      find("com.google.android.calendar"),
                      find("com.google.android.deskclock")
                  )
                  prefs.setList("dock", dock.map { it.key })
                  prefs.setList("pinned", pins.map { it.key })
                  prefs.sp.edit().putBoolean("init", true).apply()
              }

              private fun launch(a: AppItem) {
                  try {
                      la.startMainActivity(a.component, Process.myUserHandle(), null, null)
                  } catch (e: Exception) {
                      toast("Couldn't open " + a.label)
                      return
                  }
                  val r = prefs.list("recents")
                  r.remove(a.key)
                  r.add(0, a.key)
                  prefs.setList("recents", r.take(8))
                  closeDrawer(false)
              }

              private fun toast(t: String) {
                  Toast.makeText(this, t, Toast.LENGTH_SHORT).show()
              }

              private fun showMenu(a: AppItem) {
                  val dock = prefs.list("dock")
                  val hidden = prefs.list("hidden")
                  val names = ArrayList<String>()
                  val acts = ArrayList<() -> Unit>()
                  fun add(t: String, f: () -> Unit) {
                      names.add(t)
                      acts.add(f)
                  }
                  try {
                      val q = LauncherApps.ShortcutQuery()
                          .setPackage(a.component.packageName)
                          .setQueryFlags(
                              LauncherApps.ShortcutQuery.FLAG_MATCH_DYNAMIC or
                                  LauncherApps.ShortcutQuery.FLAG_MATCH_MANIFEST or
                                  LauncherApps.ShortcutQuery.FLAG_MATCH_PINNED
                          )
                      val list: List<ShortcutInfo> = la.getShortcuts(q, Process.myUserHandle()) ?: emptyList()
                      list.filter { it.isEnabled && it.shortLabel != null }.take(4).forEach { s ->
                          add("› " + s.shortLabel) { la.startShortcut(s, null, null) }
                      }
                  } catch (e: Exception) {
                  }
                  val pinKey = (0 until maxPages).map { pageKey(it) }.firstOrNull { a.key in prefs.list(it) }
                  if (pinKey != null) {
                      add("Remove from home") {
                          val l = prefs.list(pinKey)
                          l.remove(a.key)
                          prefs.setList(pinKey, l)
                          renderHome()
                      }
                  } else {
                      add("Pin to home") {
                          val k = (0 until maxPages).firstOrNull { prefs.list(pageKey(it)).size < pageCap(it) }
                          if (k == null) {
                              toast("Home is full")
                          } else {
                              val l = prefs.list(pageKey(k))
                              l.add(a.key)
                              prefs.setList(pageKey(k), l)
                              renderHome()
                          }
                      }
                  }
                  if (a.key in dock) {
                      add("Remove from dock") {
                          dock.remove(a.key)
                          prefs.setList("dock", dock)
                          renderHome()
                      }
                  } else {
                      add("Add to dock") {
                          if (dock.size >= 5) {
                              toast("Dock is full")
                          } else {
                              dock.add(a.key)
                              prefs.setList("dock", dock)
                              renderHome()
                          }
                      }
                  }
                  if (a.key in hidden) {
                      add("Unhide app") {
                          hidden.remove(a.key)
                          prefs.setList("hidden", hidden)
                          refreshGrid()
                      }
                  } else {
                      add("Hide from app list") {
                          hidden.add(a.key)
                          prefs.setList("hidden", hidden)
                          refreshGrid()
                      }
                  }
                  add("App info") {
                      startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + a.component.packageName)))
                  }
                  add("Uninstall") {
                      startActivity(Intent(Intent.ACTION_DELETE, Uri.parse("package:" + a.component.packageName)))
                  }
                  AlertDialog.Builder(this, android.R.style.Theme_Material_Dialog_Alert)
                      .setTitle(a.label)
                      .setItems(names.toTypedArray()) { _, i -> acts[i]() }
                      .show()
              }

              // ---------- Drag and drop (dock + favourites) ----------

              private fun startDrag(v: View, a: AppItem, list: String) {
                  drag = DragState(a.key, list)
                  v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                  v.alpha = 0.3f
                  val ok = v.startDragAndDrop(ClipData.newPlainText("app", a.key), View.DragShadowBuilder(v), null, 0)
                  if (!ok) {
                      drag = null
                      v.alpha = 1f
                      showMenu(a)
                  }
              }

              private fun itemDrag(list: String, key: String) = View.OnDragListener { v, e ->
                  val st = drag
                  when (e.action) {
                      DragEvent.ACTION_DRAG_STARTED -> st != null
                      DragEvent.ACTION_DRAG_ENTERED -> {
                          if (st != null && st.key != key) v.alpha = 0.5f
                          true
                      }
                      DragEvent.ACTION_DRAG_EXITED -> {
                          if (st != null && st.key == key) {
                              st.moved = true
                              v.alpha = 0.3f
                          } else {
                              v.alpha = 1f
                          }
                          true
                      }
                      DragEvent.ACTION_DROP -> {
                          if (st != null && st.key != key) {
                              st.dropped = true
                              moveTo(st, list, key)
                          }
                          true
                      }
                      DragEvent.ACTION_DRAG_ENDED -> {
                          v.alpha = 1f
                          endDrag()
                          true
                      }
                      else -> true
                  }
              }

              private fun containerDrag(list: String) = View.OnDragListener { _, e ->
                  val st = drag
                  when (e.action) {
                      DragEvent.ACTION_DRAG_STARTED -> st != null
                      DragEvent.ACTION_DROP -> {
                          if (st != null) {
                              st.dropped = true
                              moveTo(st, list, null)
                          }
                          true
                      }
                      DragEvent.ACTION_DRAG_ENDED -> {
                          endDrag()
                          true
                      }
                      else -> true
                  }
              }

              // Released without dragging anywhere = a plain long-press, so show the menu.
              private fun endDrag() {
                  val st = drag ?: return
                  drag = null
                  if (!st.dropped && !st.moved) {
                      val a = byKey[st.key]
                      if (a != null) showMenu(a)
                  }
              }

              private fun moveTo(st: DragState, target: String, beforeKey: String?) {
                  val src = prefs.list(st.list)
                  val dst = if (target == st.list) src else prefs.list(target)
                  val cap = capOf(target)
                  if (target != st.list && dst.size >= cap) {
                      toast(if (target == "dock") "Dock is full" else "That page is full")
                      return
                  }
                  val tIdx = if (beforeKey == null) dst.size else dst.indexOf(beforeKey).let { if (it < 0) dst.size else it }
                  src.remove(st.key)
                  dst.remove(st.key)
                  dst.add(min(tIdx, dst.size), st.key)
                  if (target != st.list) prefs.setList(st.list, src)
                  prefs.setList(target, dst)
                  ui.post { renderHome() }
              }

              // ---------- Drawer ----------

              private fun refreshGrid() {
                  val q = search.text.toString().trim().lowercase()
                  val hidden = prefs.list("hidden")
                  shown = if (q.isEmpty()) {
                      apps.filter { it.key !in hidden }
                  } else {
                      apps.filter { it.label.lowercase().contains(q) }
                          .sortedBy { if (it.label.lowercase().startsWith(q)) 0 else 1 }
                  }
                  grid.numColumns = prefs.columns
                  search.background = rounded(navy(0xCC), 26, withAlpha(prefs.accent, 0x88), 1)
                  appAdapter.notifyDataSetChanged()
              }

              private fun openDrawer() {
                  if (drawerOpen || apps.isEmpty()) return
                  drawerOpen = true
                  search.setText("")
                  refreshGrid()
                  drawer.alpha = 0f
                  drawer.translationY = dp(60).toFloat()
                  drawer.visibility = View.VISIBLE
                  drawer.animate().alpha(1f).translationY(0f).setDuration(180).start()
              }

              private fun closeDrawer(animate: Boolean = true) {
                  if (!drawerOpen) return
                  drawerOpen = false
                  val imm = getSystemService(Context.INPUT_METHOD_SERVICE) as InputMethodManager
                  imm.hideSoftInputFromWindow(search.windowToken, 0)
                  search.clearFocus()
                  if (animate) {
                      drawer.animate().alpha(0f).translationY(dp(60).toFloat()).setDuration(150).withEndAction {
                          if (!drawerOpen) drawer.visibility = View.GONE
                      }.start()
                  } else {
                      drawer.animate().cancel()
                      drawer.visibility = View.GONE
                  }
              }

              @SuppressLint("WrongConstant", "PrivateApi")
              private fun expandNotifications() {
                  try {
                      val sb = getSystemService("statusbar")
                      Class.forName("android.app.StatusBarManager").getMethod("expandNotificationsPanel").invoke(sb)
                  } catch (e: Throwable) {
                  }
              }

              // ---------- Gestures (swipe up = drawer, swipe down = notifications) ----------

              override fun dispatchTouchEvent(ev: MotionEvent): Boolean {
                  when (ev.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          dX = ev.x
                          dY = ev.y
                          dT = ev.eventTime
                          atTop = !grid.canScrollVertically(-1)
                      }
                      MotionEvent.ACTION_UP -> {
                          val dy = ev.y - dY
                          val dx = ev.x - dX
                          val dt = ev.eventTime - dT
                          if (dt < 600 && abs(dy) > dp(90) && abs(dy) > abs(dx) * 1.5f) {
                              if (drawerOpen) {
                                  if (dy > 0 && atTop) closeDrawer()
                              } else if (dy < 0) {
                                  openDrawer()
                              } else {
                                  expandNotifications()
                              }
                          }
                      }
                  }
                  return super.dispatchTouchEvent(ev)
              }
          }
