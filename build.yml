      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk nexus-phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-phone-apk
          path: nexus-phone.apk

      - name: Publish to Releases (always the latest build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NEXUS Phone (latest build)
          files: nexus-phone.apk
          make_latest: true
